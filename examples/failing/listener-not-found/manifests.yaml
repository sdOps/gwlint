# The route names a listener the Gateway does not declare. Gateway API treats
# sectionName as a hard requirement, so the route is never accepted onto the
# Gateway; the reason appears only in the route's status conditions.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lnf-gateway
  namespace: lnf
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      port: 80
      protocol: HTTP
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - name: placeholder-cert
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lnf-route
  namespace: lnf
spec:
  parentRefs:
    - name: lnf-gateway
      sectionName: htps
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: lnf-upstream
