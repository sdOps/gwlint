# Attached to portclash-gateway purely so it is not an idle Gateway; this route has nothing
# to do with what this scenario demonstrates.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portclash-unrelated-route
  namespace: portclash
spec:
  parentRefs:
    - name: portclash-gateway
  rules:
    - backendRefs:
        - name: portclash-unrelated-service
          port: 8080
