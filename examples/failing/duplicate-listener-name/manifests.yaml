# Two listeners share the name "web". A listener name is the only handle a
# route sectionName or a listener-scoped policy has on it, and the CEL rule
# that forbids this is a Kubernetes extension a schema validator never
# evaluates, so this applies cleanly and fails only at the API server.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: dupname-gateway
  namespace: dupname
spec:
  gatewayClassName: eg
  listeners:
    - name: web
      port: 80
      protocol: HTTP
    - name: web
      port: 8080
      protocol: HTTP
