# Attached to dupname-gateway purely so it is not an idle Gateway; this route has nothing
# to do with what this scenario demonstrates.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dupname-unrelated-route
  namespace: dupname
spec:
  parentRefs:
    - name: dupname-gateway
  rules:
    - backendRefs:
        - name: dupname-unrelated-service
          port: 8080
