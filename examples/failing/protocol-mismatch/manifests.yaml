# The listener is raw TCP; the route is an HTTPRoute. Gateway API derives the
# accepted route kinds from the listener protocol, and HTTPRoute is not one of
# them for TCP, so the route never attaches even though both objects and the
# apply are entirely valid on their own.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: pm-gateway
  namespace: pm
spec:
  gatewayClassName: eg
  listeners:
    - name: raw-tcp
      port: 5432
      protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pm-route
  namespace: pm
spec:
  parentRefs:
    - name: pm-gateway
  rules:
    - backendRefs:
        - name: pm-service
          port: 5432
