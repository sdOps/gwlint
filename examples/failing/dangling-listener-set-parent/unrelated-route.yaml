# Attached to dlsp-real-gateway purely so it is not an idle Gateway; this route has nothing
# to do with what this scenario demonstrates.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dlsp-unrelated-route
  namespace: dlsp
spec:
  parentRefs:
    - name: dlsp-real-gateway
  rules:
    - backendRefs:
        - name: dlsp-unrelated-service
          port: 8080
