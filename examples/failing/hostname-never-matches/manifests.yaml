# The route only ever matches api.example.com; the listener it attaches to
# only ever matches www.example.com. Gateway API intersects the two sets, the
# intersection is empty, and the route still attaches and still applies
# cleanly. No request can ever reach it.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hnm-gateway
  namespace: hnm
spec:
  gatewayClassName: eg
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - name: placeholder-cert
      hostname: www.example.com
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hnm-route
  namespace: hnm
spec:
  parentRefs:
    - name: hnm-gateway
  hostnames:
    - api.example.com
  rules:
    - backendRefs:
        - name: hnm-service
          port: 8080
