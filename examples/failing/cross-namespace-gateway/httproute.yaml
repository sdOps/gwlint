# An application team's route, in its own namespace, attaching across
# namespaces to the platform team's Gateway. Its backendRef omits a
# namespace, so it resolves in this route's namespace, not the policy's.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ledger-route
  namespace: ledger
spec:
  parentRefs:
    - name: edge-gateway
      namespace: infra
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: ledger-upstream
