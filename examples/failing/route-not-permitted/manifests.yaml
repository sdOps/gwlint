# The listener admits routes only from its own namespace, and the route is in
# another one. Both objects are valid and the attachment simply never happens.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: rnp-gateway
  namespace: rnp-infra
spec:
  gatewayClassName: eg
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - name: placeholder-cert
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rnp-route
  namespace: rnp-tenant
spec:
  parentRefs:
    - name: rnp-gateway
      namespace: rnp-infra
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: rnp-upstream
