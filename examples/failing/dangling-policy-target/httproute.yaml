apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dpt-orders-route
  namespace: dpt-shop
spec:
  parentRefs:
    - name: dpt-edge-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /orders
      backendRefs:
        - name: dpt-orders
          port: 8080
