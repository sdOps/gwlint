# Attached to dgc-gateway purely so it is not an idle Gateway; this route has nothing
# to do with what this scenario demonstrates.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dgc-unrelated-route
  namespace: dgc
spec:
  parentRefs:
    - name: dgc-gateway
  rules:
    - backendRefs:
        - name: dgc-unrelated-service
          port: 8080
