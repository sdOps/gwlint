# The certificate lives in the namespace that owns it, and the listener names
# it correctly, but nothing in that namespace permits the reference. Gateway
# API makes the certificate's owner opt in, so the listener is left with
# ResolvedRefs=False and reason RefNotPermitted, and never serves TLS.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: certgrant-edge-gateway
  namespace: certgrant-edge
spec:
  gatewayClassName: eg
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: certgrant-wildcard-tls
            namespace: certgrant-certs
---
apiVersion: v1
kind: Secret
metadata:
  name: certgrant-wildcard-tls
  namespace: certgrant-certs
type: kubernetes.io/tls
data:
  tls.crt: ""
  tls.key: ""
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: certgrant-edge-route
  namespace: certgrant-edge
spec:
  parentRefs:
    - name: certgrant-edge-gateway
  rules:
    - backendRefs:
        - name: certgrant-edge-api
          port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: certgrant-edge-api
  namespace: certgrant-edge
spec:
  ports:
    - port: 8080
      targetPort: 8080
