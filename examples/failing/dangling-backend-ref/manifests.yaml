# The route points at a Service that is not there. Gateway API resolves a
# backendRef at runtime, so this applies cleanly and then serves errors.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: storefront-gateway
  namespace: storefront
spec:
  gatewayClassName: eg
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
---
apiVersion: v1
kind: Service
metadata:
  name: storefront-checkout
  namespace: storefront
spec:
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: storefront-route
  namespace: storefront
spec:
  parentRefs:
    - name: storefront-gateway
  rules:
    - backendRefs:
        - name: storefront-chekout
          port: 8080
