# Two HTTPRoutes on the same listener claim the same hostname with the same
# path match. Gateway API ranks overlapping routes by hostname length, path
# length, then header and query parameter counts; these are identical on every
# one of them, so nothing in the manifests says which route wins.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: crm-shop-checkout-blue
  namespace: crm-shop
spec:
  parentRefs:
    - name: crm-shop-gateway
      sectionName: http
  hostnames:
    - crm-shop.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /checkout
      backendRefs:
        - name: crm-shop-blue
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: crm-shop-checkout-green
  namespace: crm-shop
spec:
  parentRefs:
    - name: crm-shop-gateway
      sectionName: http
  hostnames:
    - crm-shop.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /checkout
      backendRefs:
        - name: crm-shop-green
          port: 8080
