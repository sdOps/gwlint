apiVersion: v1
kind: Service
metadata:
  name: refgrant-orders-api
  namespace: refgrant-payments
spec:
  ports:
    - port: 8080
      targetPort: 8080
---
# A grant is present in the target namespace, so the manifest set does describe
# its grants. It just permits a different consumer namespace.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: refgrant-payments-allow-warehouse
  namespace: refgrant-payments
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: refgrant-warehouse
  to:
    - group: ""
      kind: Service
