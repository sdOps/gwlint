# The listener terminates TLS with a Secret that is not there: the name is one
# character off the Secret next to it. This applies cleanly, and the listener
# is then never programmed, so every TLS handshake on port 443 fails.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: certref-edge-gateway
  namespace: certref-edge
spec:
  gatewayClassName: eg
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: certref-edge-tls-cert
---
apiVersion: v1
kind: Secret
metadata:
  name: certref-edge-tls
  namespace: certref-edge
type: kubernetes.io/tls
data:
  tls.crt: ""
  tls.key: ""
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: certref-edge-route
  namespace: certref-edge
spec:
  parentRefs:
    - name: certref-edge-gateway
  rules:
    - backendRefs:
        - name: certref-edge-api
          port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: certref-edge-api
  namespace: certref-edge
spec:
  ports:
    - port: 8080
      targetPort: 8080
