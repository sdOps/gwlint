# Attached to lspr-real-gateway purely so it is not an idle Gateway; this route has nothing
# to do with what this scenario demonstrates.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lspr-unrelated-route
  namespace: lspr
spec:
  parentRefs:
    - name: lspr-real-gateway
  rules:
    - backendRefs:
        - name: lspr-unrelated-service
          port: 8080
