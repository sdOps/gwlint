# The same hostname and the same path on two listeners of one Gateway is a
# normal split, not a conflict: a request arrives on one listener or the other,
# never both, so only one route can ever serve it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: crm-edge-public-entry
  namespace: crm-edge
spec:
  parentRefs:
    - name: crm-edge-gateway
      sectionName: plain
  hostnames:
    - crm-edge.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: crm-edge-public
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: crm-edge-internal-entry
  namespace: crm-edge
spec:
  parentRefs:
    - name: crm-edge-gateway
      sectionName: internal
  hostnames:
    - crm-edge.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: crm-edge-internal
          port: 8080
