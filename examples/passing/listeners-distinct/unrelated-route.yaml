# Attached to portsok-gateway purely so it is not an idle Gateway; this route has nothing
# to do with what this scenario demonstrates.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portsok-unrelated-route
  namespace: portsok
spec:
  parentRefs:
    - name: portsok-gateway
  rules:
    - backendRefs:
        - name: portsok-unrelated-service
          port: 8080
