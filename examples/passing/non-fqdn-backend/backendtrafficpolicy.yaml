# No health check configured, same as the failing examples, but this
# Backend uses an IP endpoint instead of an FQDN, so it never enters
# Envoy Gateway's DNS-resolving cluster path and the check does not flag it.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: inventory-api-route-policy
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: inventory-api-route
