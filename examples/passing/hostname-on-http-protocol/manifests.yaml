# The same shape, on HTTP, where a hostname is meaningful and matched against
# the Host header.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hohp-gateway
  namespace: hohp
spec:
  gatewayClassName: eg
  listeners:
    - name: web
      port: 80
      protocol: HTTP
      hostname: web.hohp.internal
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hohp-route
  namespace: hohp
spec:
  parentRefs:
    - name: hohp-gateway
  hostnames:
    - web.hohp.internal
  rules:
    - backendRefs:
        - name: hohp-service
          port: 80
