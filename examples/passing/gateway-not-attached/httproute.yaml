# Attached to "some-other-gateway", not the "public-gateway" the policy
# below targets, so the policy's coverage never reaches this route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: partner-api-route
  namespace: default
spec:
  parentRefs:
    - name: some-other-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /partner-api
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: partner-api-upstream
          port: 443
