# Attached to "some-other-gateway", not the "gateway-public" the policy
# below targets, so the policy's coverage never reaches this route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sso-route
  namespace: default
spec:
  parentRefs:
    - name: some-other-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /sso
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: sso-upstream
          port: 443
