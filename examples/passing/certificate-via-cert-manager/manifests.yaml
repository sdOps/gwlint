# cert-manager creates the listener's TLS Secret from this Certificate object
# at apply time; the chart never renders a Secret manifest of its own. A
# manifest set carrying the Certificate but not the Secret is not missing
# anything, and gwlint has to know that rather than flagging the reference.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cvcm-gateway
  namespace: cvcm
spec:
  gatewayClassName: eg
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - name: cvcm-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cvcm-tls
  namespace: cvcm
spec:
  secretName: cvcm-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - cvcm.example.com
---
# Attached to cvcm-gateway purely so it is not an idle Gateway; this route has
# nothing to do with what this scenario demonstrates.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cvcm-unrelated-route
  namespace: cvcm
spec:
  parentRefs:
    - name: cvcm-gateway
  rules:
    - backendRefs:
        - name: cvcm-unrelated-service
          port: 8080
