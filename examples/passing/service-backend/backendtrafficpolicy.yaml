# No health check configured -- same as the failing examples -- but the
# route's backend is a plain Kubernetes Service, not an Envoy Gateway
# Backend, so there's no FQDN endpoint for the check to find and it
# correctly finds nothing.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: partner-api-route-policy
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: partner-api-route
