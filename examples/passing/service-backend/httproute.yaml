# backendRefs with no group/kind override default to a core Service, not
# an Envoy Gateway Backend, so this route never enters the DNS-resolving
# cluster path the check looks for.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: search-api-route
  namespace: default
spec:
  parentRefs:
    - name: main-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /partner-api
      backendRefs:
        - name: search-api-service
          port: 80
