# The same shape, with the certificateRef naming the Secret that is actually
# there.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: certref-ok-gateway
  namespace: certref-ok
spec:
  gatewayClassName: eg
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: certref-ok-tls
---
apiVersion: v1
kind: Secret
metadata:
  name: certref-ok-tls
  namespace: certref-ok
type: kubernetes.io/tls
data:
  tls.crt: ""
  tls.key: ""
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: certref-ok-route
  namespace: certref-ok
spec:
  parentRefs:
    - name: certref-ok-gateway
  rules:
    - backendRefs:
        - name: certref-ok-api
          port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: certref-ok-api
  namespace: certref-ok
spec:
  ports:
    - port: 8080
      targetPort: 8080
