# The same shape, with the route's hostname covered by the listener's wildcard.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hi-gateway
  namespace: hi
spec:
  gatewayClassName: eg
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - name: placeholder-cert
      hostname: "*.example.com"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hi-route
  namespace: hi
spec:
  parentRefs:
    - name: hi-gateway
  hostnames:
    - api.example.com
  rules:
    - backendRefs:
        - name: hi-service
          port: 8080
