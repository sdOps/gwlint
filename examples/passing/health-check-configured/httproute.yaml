apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: checkout-api-route
  namespace: default
spec:
  parentRefs:
    - name: healthcheck-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /partner-api
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: checkout-api-upstream
          port: 443
