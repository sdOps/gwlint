# The same shape, with a redirect filter that answers the request by itself.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rhf-route
  namespace: rhf
spec:
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /retired
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /current
            statusCode: 301
