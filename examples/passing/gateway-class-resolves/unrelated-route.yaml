# Attached to gcr-gateway purely so it is not an idle Gateway; this route has nothing
# to do with what this scenario demonstrates.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gcr-unrelated-route
  namespace: gcr
spec:
  parentRefs:
    - name: gcr-gateway
  rules:
    - backendRefs:
        - name: gcr-unrelated-service
          port: 8080
