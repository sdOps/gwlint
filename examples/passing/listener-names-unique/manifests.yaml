# The same shape, with each listener under its own name.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: uniquename-gateway
  namespace: uniquename
spec:
  gatewayClassName: eg
  listeners:
    - name: web
      port: 80
      protocol: HTTP
    - name: web-admin
      port: 8080
      protocol: HTTP
