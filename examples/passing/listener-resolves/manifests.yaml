# The same shape, with sectionName naming a listener that exists.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lres-gateway
  namespace: lres
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      port: 80
      protocol: HTTP
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - name: placeholder-cert
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lres-route
  namespace: lres
spec:
  parentRefs:
    - name: lres-gateway
      sectionName: https
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: lres-upstream
