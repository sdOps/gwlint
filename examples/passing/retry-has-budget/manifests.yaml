# The same shape, with a per-retry timeout capping the cost of each attempt.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: rhb-policy
  namespace: rhb
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: rhb-route
  retry:
    numRetries: 5
    perRetry:
      timeout: 250ms
