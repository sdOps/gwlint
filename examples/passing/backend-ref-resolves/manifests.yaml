# The same shape with the backendRef naming the Service that is actually there.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: warehouse-gateway
  namespace: warehouse
spec:
  gatewayClassName: eg
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - name: placeholder-cert
---
apiVersion: v1
kind: Service
metadata:
  name: warehouse-checkout
  namespace: warehouse
spec:
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: warehouse-route
  namespace: warehouse
spec:
  parentRefs:
    - name: warehouse-gateway
  rules:
    - backendRefs:
        - name: warehouse-checkout
          port: 8080
