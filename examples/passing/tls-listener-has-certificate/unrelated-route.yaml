# Attached to tlhc-gateway purely so it is not an idle Gateway; this route has nothing
# to do with what this scenario demonstrates.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tlhc-unrelated-route
  namespace: tlhc
spec:
  parentRefs:
    - name: tlhc-gateway
  rules:
    - backendRefs:
        - name: tlhc-unrelated-service
          port: 8080
