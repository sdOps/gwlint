apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dptok-orders-route
  namespace: dptok-shop
spec:
  parentRefs:
    - name: dptok-edge-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /orders
      backendRefs:
        - name: dptok-orders
          port: 8080
