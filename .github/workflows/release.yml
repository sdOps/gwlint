name: Release

# Manual promotion, never automatic. A push to main or a merged PR is not
# a release on its own; someone decides when main is ready to become a
# tagged version, and dispatches this workflow to make that happen.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to tag, e.g. v0.2.0. Leave blank to use git-cliff's own
          suggestion, computed from Conventional Commit types since the
          last tag.
        required: false
        type: string

# Needs to push a tag and create a release. Tags are a separate ref
# namespace from branches, so the branch protection ruleset on main
# (required signatures, required status checks) does not apply to them;
# nothing here touches a branch.
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: git-cliff and git describe both need it
          persist-credentials: true # need to push the tag below

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      # Without this, mise run check's lint step hit a cold module download
      # for gwlint's whole (kube-linter-derived) dependency graph, competing
      # with build/vet/test for the same downloads, and blew golangci-lint's
      # 5m timeout before go/packages finished loading. Same key as ci.yml's
      # lint job, so this is usually already warm from the last CI run on
      # main by the time anyone dispatches a release.
      - name: Cache Go modules and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-lint-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-lint-

      # The same gate a pull request has to pass, run again here rather than
      # trusted from the branch's last CI run: workflow_dispatch can be run
      # from any ref, and nothing stops it being fired against a branch that
      # was never checked.
      - run: mise run check

      - name: Determine the version to release
        id: version
        run: |
          set -eu
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version=$(mise exec -- git-cliff --bumped-version)
          fi
          if ! echo "$version" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version '$version' does not look like vX.Y.Z" >&2
            exit 1
          fi
          if git rev-parse "$version" >/dev/null 2>&1; then
            echo "Tag $version already exists." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          set -eu
          mise exec -- git-cliff --tag "${{ steps.version.outputs.version }}" --unreleased -o release-notes.md

          # Read straight from go.mod rather than hand-typing a version:
          # this is what the tagged commit actually pins, so it can't drift
          # from reality the way a maintained-by-hand note eventually would.
          # Envoy Gateway's gateway.envoyproxy.io/v1alpha1 API in particular
          # has had real breaking changes between minor releases (see
          # AGENTS.md's Gateway API domain notes), so knowing exactly which
          # version a given gwlint release was built against matters.
          gwapi_version=$(awk '/sigs\.k8s\.io\/gateway-api /{print $2}' go.mod)
          eg_version=$(awk '/github\.com\/envoyproxy\/gateway /{print $2}' go.mod)
          {
            echo ""
            echo "## Compatibility"
            echo ""
            echo "| Dependency | Version |"
            echo "|---|---|"
            echo "| Gateway API | $gwapi_version |"
            echo "| Envoy Gateway | $eg_version |"
          } >> release-notes.md

          cat release-notes.md

      - name: Tag and push
        run: |
          # An annotated tag is a commit-like object and needs an identity to
          # create, same as a commit does; actions/checkout sets up the repo
          # for fetch/push but never configures one.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      # Draft: the build job below still has to cross-compile and attach
      # binaries. Publishing the release before they land would leave a
      # window where the release exists with nothing to download.
      - name: Create draft GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            --draft

  build:
    needs: tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.version }}

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      # No cgo anywhere in gwlint (a manifest linter has no reason for it),
      # so this cross-compiles cleanly from one Linux runner; no per-target
      # runner needed the way the CI test matrix needs one to actually run
      # the binary on each OS.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -eu
          ext=""
          [ "${{ matrix.goos }}" = "windows" ] && ext=".exe"
          name="gwlint-${{ needs.tag.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}$ext"
          go build -ldflags "-X github.com/sdOps/gwlint/pkg/version.version=${{ needs.tag.outputs.version }}" -o "$name" ./cmd/gwlint
          echo "artifact=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.artifact }}
          path: ${{ env.artifact }}
          if-no-files-found: error

  publish:
    needs: [tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Checksum
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - name: Attach binaries and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # gh infers the target repo from the current git checkout otherwise,
          # and this job has none: it only downloads artifacts, it never
          # checks out the source.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ needs.tag.outputs.version }}" dist/* --clobber
          gh release edit "${{ needs.tag.outputs.version }}" --draft=false
